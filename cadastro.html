<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css" >
    <title>Cadastro</title>
</head>
<body>
    <h1>Formulário de Cadastro</h1>
    <form action="https://webhook.site/b7befdb3-6a8a-4e06-a63b-98a8e2af9518 " method="POST">
    <br><br>
    <label for="nome">Nome:</label>
        <input 
            type="text"
            id="nome"
            name="name"
            required
            min-length="2"
            max-length="50"
            placeholder="Digite seu nome"
>

<br><br>
 <label for="email">E-mail:</label>
        <input 
            type="email"
            id="email"
            name="email"
            required
            placeholder="exemplo@dominio.com"
>

<br><br>
 <label for="telefone">Telefone:</label>
        <input 
            type="tel"
            id="telefone"
            name="telefone"
            required
            placeholder="(XX) XXXXX-XXXX"
            pattern="\(\d{2}\) \d{4,5}-\d{4}"
>

<br><br>
 <label for="idade">Idade:</label>
        <input 
            type="number"
            id="Idade"
            name="Idade"
            required
            min="18"
            max="120"
            step="1"
>

<br><br>
 <label for="data-nascimento">Data de Nascimento:</label>
        <input 
            type="date"
            id="data-nascimento"
            name="data-nascimento"
            required
            min="1900-01-01"
            max="2026-07-24"
>

<br><br>
 <label for="website">Página Pessoal:</label>
        <input 
            type="url"
            id="website"
            name="website"
            required
            placeholder="https://www.seusite.com" -->
>

<br><br>
 <label for="comentarios">Comentarios:</label>
    <textarea
            id="comentarios"
            name="comentarios"
            rows="4"
            cols="50"
            maxlength="500"
            placeholder="Deixe seu comentario aqui"
    ></textarea>
<br><br>

<button type="submit">Cadastrar</button>

</form>

</body>
</html>
